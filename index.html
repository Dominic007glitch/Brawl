<!DOCTYPE html>

<head>

    <!-- FONTES ATUALIZADAS -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Montserrat:wght@800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bs-yellow: #FFCB05;
            --bs-blue: #000000;
            --bs-purple: #8D32FF;
            --bs-orange: #FF8A00;
            --bs-dark: #1A1A1A;
            --bs-white: #ffffff;
            --bs-shadow: 0px 6px 0px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif; /* ALTERADO */
        }
 
        body {
    background: radial-gradient(circle at center, #000000 0%, #000000 70%);
    
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 4%;
    color: var(--bs-white);
}


       
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .profile-header {
            margin-bottom: 30px;
        }

        .profile-img {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: 5px solid var(--bs-yellow);
            box-shadow: var(--bs-shadow);
            margin-bottom: 15px;
            object-fit: cover;
        }

        /* TÍTULO COM NOVA FONTE */
        h1 {
            font-family: 'Bangers', cursive;
            font-size: 28px;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0px #000000;
            -webkit-text-stroke: 1px #000;
            line-height: 1.2;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* BOTÕES COM NOVA FONTE */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            color: var(--bs-white);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
            position: relative;
            border: 3px solid #000;
            box-shadow: var(--bs-shadow);
        }

        .btn i {
            margin-right: 12px;
            font-size: 24px;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0px 2px 0px rgba(0, 0, 0, 0.3);
        }

        .btn:hover {
            transform: scale(1.05);
        }

/* ===================== WHATSAPP ===================== */

.btn-whatsapp {
    background: linear-gradient(135deg, #25D366 0%, #1ebe5d 45%, #128C7E 100%);
    color: #fff;
    border: none;
    box-shadow:
        0 6px 18px rgba(37, 211, 102, .45),
        0 0 15px rgba(37, 211, 102, .25);
    animation: whatsappGlow 1.8s infinite;
    transition: .3s ease;
}

.btn-whatsapp:hover {
    transform: translateY(-3px) scale(1.03);
    filter: brightness(1.08);
    box-shadow:
        0 10px 28px rgba(37,211,102,.6),
        0 0 28px rgba(37,211,102,.45);
}

@keyframes whatsappGlow {
    0% {
        box-shadow:
            0 6px 18px rgba(37,211,102,.45),
            0 0 8px rgba(37,211,102,.2);
    }

    50% {
        box-shadow:
            0 8px 24px rgba(37,211,102,.65),
            0 0 24px rgba(37,211,102,.55);
    }

    100% {
        box-shadow:
            0 6px 18px rgba(37,211,102,.45),
            0 0 8px rgba(37,211,102,.2);
    }
}


/* ===================== INSTAGRAM ===================== */

.btn-instagram {
    background: linear-gradient(
        135deg,
        #833AB4 0%,
        #C13584 35%,
        #E1306C 55%,
        #FD1D1D 75%,
        #FCAF45 100%
    );
    color: #fff;
    border: none;
    transition: .3s ease;
    box-shadow: 0 6px 18px rgba(193,53,132,.35);
}

.btn-instagram:hover {
    transform: translateY(-3px);
    filter: brightness(1.05);
    box-shadow: 0 10px 25px rgba(193,53,132,.45);
}


/* ===================== TIKTOK ===================== */

.btn-tiktok {
    background: linear-gradient(135deg, #111111 0%, #1d1d1d 100%);
    color: #fff;
    border: 2px solid rgba(255,255,255,.06);
    position: relative;
    overflow: hidden;
    transition: .3s ease;
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
}

.btn-tiktok::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        90deg,
        rgba(37,244,238,.18),
        transparent 35%,
        transparent 65%,
        rgba(254,44,85,.18)
    );
    pointer-events: none;
}

.btn-tiktok:hover {
    transform: translateY(-3px);
    box-shadow:
        -4px 0 15px rgba(37,244,238,.35),
        4px 0 15px rgba(254,44,85,.35),
        0 10px 22px rgba(0,0,0,.4);
}


.subtitle{
    margin-top:12px;
    font-size:18px;
    font-weight:700;
    color:white;
}

.mini-info{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:18px;
    color:#d6d6d6;
    font-size:15px;
    font-weight:600;
}


.cta{
    margin-bottom:16px;
    font-size:19px;
    font-weight:800;
    color:#FFCB05;
    animation: pulse 1.6s infinite;
}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.07);
}

100%{
transform:scale(1);
}

}



</style>



</head>

    </div>

</header>

            </a>
